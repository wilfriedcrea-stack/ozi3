<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%" fill="none">
  <!-- Defs & Shadows -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Red Angular Wings / Wings of Kamina -->
    <path d="M 20 50 L 160 130 L 125 185 L 75 145 Z" fill="#ff4d42" />
    <path d="M 440 45 L 300 130 L 335 185 L 385 145 Z" fill="#ff4d42" />
    <polygon points="120,135 230,195 340,135 290,120 230,140 170,120" fill="#e6392f" />

    <!-- Crosshair / Reticle Sword Motif -->
    <g transform="translate(340, 95) rotate(-35)">
      <!-- Blade / needle -->
      <polygon points="-6,-90 6,-90 8,80 -8,80" fill="#20222a" stroke="#ffffff" stroke-width="2"/>
      <polygon points="-2,-85 2,-85 3,75 -3,75" fill="#f8fafc"/>
      <!-- Target Circles -->
      <circle cx="0" cy="0" r="32" stroke="#20222a" stroke-width="7" fill="none"/>
      <circle cx="0" cy="0" r="32" stroke="#ffffff" stroke-width="3" fill="none"/>
      <circle cx="0" cy="0" r="14" stroke="#20222a" stroke-width="4" fill="none"/>
      <!-- Crosshair ticks -->
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#ffffff" stroke-width="4"/>
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#ffffff" stroke-width="4"/>
    </g>

    <!-- Stylized "KAMINA" Bold Typography -->
    <!-- Outer thick dark outline for readability -->
    <g stroke="#12131a" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="#12131a">
      <!-- K -->
      <path d="M 45 75 L 75 75 L 75 115 L 115 75 L 145 75 L 105 120 L 150 165 L 120 165 L 85 130 L 75 140 L 75 165 L 45 165 Z" />
      <!-- A -->
      <path d="M 140 165 L 175 75 L 205 75 L 235 165 L 205 165 L 198 140 L 172 140 L 165 165 Z M 180 115 L 190 115 L 185 95 Z" />
      <!-- M -->
      <path d="M 230 165 L 230 75 L 255 75 L 275 125 L 295 75 L 320 75 L 320 165 L 295 165 L 295 115 L 282 145 L 268 145 L 255 115 L 255 165 Z" />
      <!-- I -->
      <path d="M 325 75 L 350 75 L 350 165 L 325 165 Z" />
      <!-- N -->
      <path d="M 355 165 L 355 75 L 380 75 L 405 125 L 405 75 L 425 75 L 425 165 L 400 165 L 375 115 L 375 165 Z" />
    </g>

    <!-- White Fill of the Letters -->
    <g fill="#ffffff">
      <!-- K -->
      <path d="M 45 75 L 75 75 L 75 115 L 115 75 L 145 75 L 105 120 L 150 165 L 120 165 L 85 130 L 75 140 L 75 165 L 45 165 Z" />
      <!-- A -->
      <path d="M 140 165 L 175 75 L 205 75 L 235 165 L 205 165 L 198 140 L 172 140 L 165 165 Z" />
      <polygon points="178,118 192,118 185,96" fill="#12131a" />
      <!-- M -->
      <path d="M 230 165 L 230 75 L 255 75 L 275 125 L 295 75 L 320 75 L 320 165 L 295 165 L 295 115 L 282 145 L 268 145 L 255 115 L 255 165 Z" />
      <!-- I -->
      <path d="M 325 75 L 350 75 L 350 165 L 325 165 Z" />
      <!-- N -->
      <path d="M 355 165 L 355 75 L 380 75 L 405 125 L 405 75 L 425 75 L 425 165 L 400 165 L 375 115 L 375 165 Z" />
    </g>

    <!-- Red Katakana Japanese Ribbon below -->
    <g transform="translate(145, 155)">
      <polygon points="0,0 170,0 155,36 15,36" fill="#ff4d42" />
      <!-- Japanese Katakana: カミナ -->
      <text x="85" y="27" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">カミナ</text>
    </g>
  </g>
</svg>
