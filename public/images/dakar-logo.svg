<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="100%" height="100%" fill="none">
  <defs>
    <filter id="dakar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="dakar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b6b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <g filter="url(#dakar-shadow)">
    <!-- Racing Speed Lines -->
    <path d="M 20 40 L 140 40 L 120 52 L 40 52 Z" fill="#ff4d42" opacity="0.8"/>
    <path d="M 320 115 L 440 115 L 420 127 L 340 127 Z" fill="#ff4d42" opacity="0.8"/>
    <polygon points="60,25 90,25 75,35 45,35" fill="#f59e0b"/>

    <!-- Main Title "DAKAR" Italic Speed Lettering -->
    <text x="230" y="88" 
      font-family="'Impact', 'Arial Black', sans-serif" 
      font-style="italic"
      font-weight="900" 
      font-size="68" 
      fill="#ffffff" 
      stroke="#12131a" 
      stroke-width="9" 
      paint-order="stroke fill"
      text-anchor="middle" 
      letter-spacing="6">
      DAKAR
    </text>

    <!-- Subtitle: STREET RACERS in badge -->
    <g transform="translate(145, 98) skewX(-12)">
      <polygon points="0,0 170,0 155,28 15,28" fill="#ff4d42" />
      <text x="85" y="19" 
        font-family="'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="12" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="3">
        STREET RACERS
      </text>
    </g>
  </g>
</svg>
